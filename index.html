html[data-theme="dark"]{color-scheme:dark;
  --bg:#121019;--card:#1C1926;--ink:#ECE9F3;--ink2:#B9B3C8;--ink3:#8F889F;--line:#2E2A3A;--desk:#09080D;
  --brand:#B79CFF;--brand2:#2A2342;--branddk:#9A7BF0;--onbrand:#160B2E;--focus:rgba(183,156,255,.3);--chart:#6E58B8;--toastbtn:#5B3FB0;--greet:#CDBBFF;
  --soft:#221E2D;--soft2:#282334;--soft3:#251F30;--btn:#2B2638;--field:#15121D;--fieldline:#3A3448;--switchoff:#423C50;--knob:#ECE9F3;--tick:#625A72;--faint:#5A5468;--grab:#423C50;

  --red:#FF8A80;--redbg:#3A1C1C;--redink:#FFC9C4;--amber:#F5B454;--amberbg:#3A2C12;--amberink:#FBD9A0;--green:#6FD68F;--greenbg:#16301F;--greenink:#B8EBC7;--bluebg:#15263D;--blueink:#BCD5F7;
  --due:#34D399;--appt:#D38BFF;--bday:#F472B6;--ext:#38BDF8;--hol:#FB923C;--meal:#A3E635;--pet:#D6A06B;--garden:#86EFAC;--health:#67E8F9;--mine:#8D96FF;
  --bill-bg:#3A2A17;--bill-fg:#F5B454;--todo-bg:#23264A;--todo-fg:#A5ADFB;--appt-bg:#2C2248;--appt-fg:#C4B1FC;--bday-bg:#3F1D31;--bday-fg:#F9A8D4;--bday-row:#2E1A26;
  --hol-bg:#3D2413;--idea-bg:#3A3212;--idea-fg:#F2D66B;--ext-bg:#15294A;--wx-bg:#3A3014;--wx-fg:#F6C85F;--ev-bg:#3D2316;--ev-fg:#FDBA8C;--br-bg:#123047;--br-fg:#7DD3FC;
  --meal-bg:#243313;--meal-fg:#BEF264;--gf-bg:#142A1B;--gf-line:#24533A;--gftag-bg:#1B3D26;--gftag-fg:#86EFAC;--warn-bg:#3D2413;--warn-fg:#FDBA8C;
  --mine-bg:#23264A;--pet-bg:#35281B;--garden-bg:#14301C;--health-bg:#123640;--health-bg2:#143038;--comm-bg:#16301F;--comm-fg:#6FD68F;--loan-bg:#172A4A;--loan-fg:#93B4FB;--loanpic:#3B6FD8;--star:#F6C85F;--starfill:#F6C85F;
  --wxsun:#F7B73A;--wxmoon:#E2D38C;--wxcloud:#7D8A95;--wxcloud2:#66727D;--wxcloudline:#A6B1BA;--wxrain:#5EA8FF;--wxsnow:#E8EEEC;--wxbolt:#FACC15;--wxfog:#9AA6B0;--wxcool:#5EA8FF;--wxwarm:#F7B73A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
body{overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:fixed;top:0;bottom:0;left:0;right:0;width:100%;max-width:560px;margin:0 auto;background:var(--bg);overflow:hidden}
@media (min-width:600px){html{background:var(--desk)}
#app{box-shadow:0 0 0 1px var(--line),0 10px 40px rgba(0,0,0,.08)}}
#view{position:absolute;top:0;bottom:0;left:0;right:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;padding:calc(var(--sat) + 10px) calc(16px + var(--sar)) calc(28px + var(--sab)) calc(16px + var(--sal));-webkit-overflow-scrolling:touch}
#view::-webkit-scrollbar{display:none}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:6px 0 12px}
.top h1{font-size:1.75rem;line-height:1.15;margin:0;letter-spacing:-.5px}
.top .sub{color:var(--ink2);font-size:0.9375rem;margin-top:4px}
.iconbtn{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.08);color:var(--ink);flex:none}
.iconbtn.add{background:var(--brand);color:var(--onbrand)}
.iconrow{display:flex;gap:8px;flex:none}
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 1px 2px rgba(16,24,20,.05);padding:14px}
.sec{font-size:0.8125rem;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--ink3);margin:22px 4px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec a,.sec button{text-transform:none;letter-spacing:0;font-weight:600;color:var(--brand);font-size:0.875rem}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:0.78125rem;font-weight:700;border-radius:999px;padding:4px 9px;white-space:nowrap}
.pill.over{color:var(--red);background:var(--redbg)}
.pill.paid{color:var(--green);background:var(--greenbg)}
.pill.none{color:var(--ink2);background:var(--soft2)}
.duepill{color:#fff;font-size:0.8125rem;font-weight:800;letter-spacing:.01em;padding:5px 12px;border-radius:999px;box-shadow:0 1px 2px rgba(0,0,0,.14)}
.duepill.hot{background:linear-gradient(135deg,#E85D04,#C62828);color:#fff}
.duepill.warm{background:linear-gradient(135deg,#FFE082,#F5C518);color:#3F2E04}
.duepill.cool{background:linear-gradient(135deg,#1B7A3E,#1565C0);color:#fff}
.badgestack{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.moneybadge{display:flex;flex-direction:column;align-items:flex-end;line-height:1.05;text-align:right;max-width:9.5rem}
.moneybadge b{font-size:1.1875rem;font-weight:800;letter-spacing:-.03em;color:var(--ink);font-variant-numeric:tabular-nums}
.moneybadge small{display:block;margin-top:3px;font-size:0.75rem;font-weight:650;color:var(--ink2);max-width:9.5rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 2px rgba(16,24,20,.05)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;text-align:left;min-height:56px}
.row:first-child{border-top:0}
.row .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.row .ic svg.i{width:22px;height:22px}
.row .tx{flex:1;min-width:0}
.row .t{font-weight:650;font-size:0.96875rem;line-height:1.25;overflow-wrap:anywhere}
.row .s{font-size:0.8125rem;color:var(--ink2);margin-top:2px;line-height:1.3}
.ic.bill{background:var(--bill-bg);color:var(--bill-fg)}
.ic.set{background:var(--soft2);color:var(--ink2)}
.row>svg.i:last-child{color:var(--ink3);width:18px;height:18px}
.empty{text-align:center;padding:22px 16px}
.empty .t{font-weight:700;font-size:1rem}
.empty .s{color:var(--ink2);font-size:0.875rem;margin:4px 0 12px;line-height:1.4}
.carcard{background:var(--card);border-radius:22px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.05);margin-bottom:12px;width:100%;text-align:left;display:block}
.carhead{display:flex;align-items:center;gap:12px}
.carpic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none}
.carpic svg.i{width:30px;height:30px;stroke:var(--white)}
.carname{font-weight:750;font-size:1.0625rem;overflow-wrap:anywhere}
.carmodel{font-size:0.84375rem;color:var(--ink2);margin-top:2px}
.back{display:flex;align-items:center;gap:2px;color:var(--brand);font-weight:600;font-size:1rem;padding:8px 0;min-height:44px}
.hero{display:flex;gap:14px;align-items:center;margin:4px 0 14px}
.hero .carpic{width:96px;height:96px;border-radius:24px}
.hero h2{margin:0 0 4px;font-size:1.5rem;letter-spacing:-.3px;overflow-wrap:anywhere}
.callout{display:flex;gap:10px;background:var(--amberbg);color:var(--amberink);border-radius:14px;padding:11px 12px;font-size:0.875rem;line-height:1.4;margin-bottom:12px}
.callout.green{background:var(--greenbg);color:var(--greenink)}
.callout svg.i{width:20px;height:20px;margin-top:1px}
.dcard{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.dcard .h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:0.9375rem;color:var(--ink2)}
.dcard .h .pill{margin-left:auto}
.big{font-size:1.4375rem;font-weight:750;margin:8px 0 2px;letter-spacing:-.3px}
.muted{color:var(--ink2);font-size:0.84375rem;line-height:1.45}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:12px 12px;font-weight:700;font-size:0.90625rem;background:var(--btn);color:var(--ink);white-space:nowrap;min-height:46px}
.btn.primary{background:var(--brand);color:var(--onbrand)}
.btn.danger{background:var(--redbg);color:var(--red)}
.btn.small{flex:0 0 auto;padding:8px 12px;min-height:38px;font-size:0.875rem}
.btn svg.i{width:18px;height:18px}
.btn:disabled{opacity:.5}
select.sel{font:inherit;font-size:0.9375rem;font-weight:600;color:var(--brand);border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:7px 8px;min-height:40px}
.notes{white-space:pre-wrap;overflow-wrap:anywhere}
.summary{background:linear-gradient(135deg,var(--brand),var(--branddk));color:var(--onbrand);border-radius:22px;padding:16px}
.summary .amt{font-size:2rem;font-weight:800;letter-spacing:-.5px;margin:4px 0}
.summary .muted{color:var(--onbrand);opacity:.82}
.summary .amt .per{font-size:1.0625rem;font-weight:700;opacity:.85;letter-spacing:0}
.summary .billsub{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.25)}
.paynav{display:flex;align-items:center;gap:8px;margin:-2px -4px 10px}
.paystep{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);color:var(--onbrand);display:grid;place-items:center;flex:0 0 auto}
.paystep svg{width:20px;height:20px}
.paystep:disabled{opacity:.3}
.paytitle{flex:1;text-align:center;line-height:1.25}
.paytitle b{display:block;font-size:1.0625rem}
.paytitle span{font-size:0.84375rem;opacity:.85}
.summary .linkbtn{color:var(--onbrand);text-decoration:underline;padding:2px 0}
.bill .right{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end}
.bill .amt{font-weight:750;font-size:1rem}
.paybtn{margin-top:6px;font-size:0.84375rem;font-weight:700;color:var(--brand);background:var(--brand2);border-radius:999px;padding:7px 12px;white-space:nowrap}
.tapzone{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:2px 2px 4px;margin-bottom:10px}
.chips::-webkit-scrollbar{display:none}
.chip{border-radius:999px;padding:8px 14px;background:var(--card);font-weight:650;font-size:0.875rem;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.06);flex:none}
.chip.on{background:var(--ink);color:var(--card)}
.chip.plus{color:var(--brand)}
.addbar{display:flex;gap:8px;margin-bottom:12px}
.addbar input{flex:1;min-width:0;border:0;border-radius:14px;padding:12px 14px;font:inherit;font-size:1rem;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.06);outline:none}
.addbar input:focus{box-shadow:0 0 0 2px var(--brand)}
.addbar button{width:48px;border-radius:14px;background:var(--brand);color:var(--onbrand);display:grid;place-items:center;flex:none}
.done .t{text-decoration:line-through;color:var(--ink3)}
.ev.done .t{text-decoration:line-through;color:var(--ink3)}
.ev>.paybtn{margin-top:0;align-self:center;flex:none}
.ev{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:6px;box-shadow:0 1px 2px rgba(0,0,0,.04);width:100%;text-align:left;min-height:50px}
.ev .time{width:62px;flex:none;font-size:0.78125rem;font-weight:650;color:var(--ink2)}
.ev .t{font-weight:650;font-size:0.9375rem;overflow-wrap:anywhere}
.ev .s{font-size:0.78125rem;color:var(--ink2);margin-top:3px}
.spent{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 4px}
.spent div{background:var(--soft);border-radius:12px;padding:8px 10px}
.spent small{display:block;font-size:0.71875rem;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.3px}
.spent b{font-size:1.0625rem}
.subhead{font-size:0.8125rem;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--ink3);margin:6px 2px 10px}
.ok{color:var(--green);font-weight:700}
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.show{display:block}
#sheet .scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .2s}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px calc(16px + var(--sar)) calc(18px + var(--sab)) calc(16px + var(--sal));animation:up .22s cubic-bezier(.2,.9,.3,1)}
#sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--grab);margin:0 auto 8px}
#sheet h3{margin:4px 0 12px;font-size:1.25rem;overflow-wrap:anywhere}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:0.84375rem;font-weight:700;color:var(--ink2);margin:0 2px 5px}

/* mascot (from My App 2.23.12) */
.hcat{display:block;position:absolute;right:40px;top:-8px;width:116px;height:96px;margin:0;padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;color:inherit}
.hcat svg{width:116px;height:96px;overflow:visible;display:block}
.hcat svg *{transform-box:fill-box;transform-origin:center}
.hcat .cfur{fill:#B9BFC8;stroke:#4B5563;stroke-width:1.1}
.hcat .cbelly{fill:#E8EBEF}
.hcat .cear{fill:#8E96A2;stroke:#4B5563;stroke-width:1.1;stroke-linejoin:round}
.hcat .cearin{fill:#F9A8C4}
.hcat .cstripe{stroke:#6B7280;stroke-width:1.2;stroke-linecap:round;fill:none}
.hcat .ctail,.hcat .ctail2{fill:none;stroke:#9CA3AF;stroke-width:3.6;stroke-linecap:round}
.hcat .ctip{stroke:#5F6773;stroke-dasharray:0 78 22}
.hcat .ctail{transform-box:view-box;transform-origin:33px 35px}
.hcat .ceye{fill:#111827;transition:transform .8s ease}
.hcat .clid{fill:none;stroke:#374151;stroke-width:1.1;stroke-linecap:round;opacity:0;transition:opacity .8s}
.hcat .cnose{fill:#E26D8D}
.hcat .cmouth{fill:#7F1D1D;transform:scale(0)}
.hcat .cwhisk{stroke:#4B5563;stroke-width:.6;stroke-linecap:round;opacity:.7}
.hcat .cshut{fill:none;stroke:#1F2937;stroke-width:1.2;stroke-linecap:round}
.hcat .chead{transform-box:view-box;transform-origin:24px 22px}
.hcat .cpaw{transform-box:view-box;transform-origin:28.5px 38px}
.hcat .csit,.hcat .csleep{transition:opacity .9s ease}
.hcat .csleep{opacity:0}
.hcat .cz{font:800 7px/1 system-ui,sans-serif;fill:#7C8DB5;opacity:0}
.hcat .cbreath{transform-box:view-box;transform-origin:26px 37px}
.hcat .cbub{position:absolute;left:66px;top:62px;white-space:nowrap;background:var(--card,#fff);color:var(--ink,#111);font-size:0.875rem;font-weight:750;letter-spacing:0;line-height:1;padding:6px 10px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.18);opacity:0;transform:translateY(4px) scale(.9);pointer-events:none;transition:opacity .2s,transform .2s;z-index:3}
.hcat.react .cbub{opacity:1;transform:none}
.hcat.cat-energetic svg{animation:catBounce .7s ease-in-out infinite}
.hcat.cat-energetic .ctail{animation:catSwish .5s ease-in-out infinite alternate}
.hcat.cat-energetic .ceye{transform:scale(1.15);animation:catBlinkBig 3.6s infinite}
.hcat.cat-energetic .cpaw{animation:catPaw 1.4s ease-in-out infinite}
.hcat.cat-alert .ctail{animation:catSwish 1.6s ease-in-out infinite alternate}
.hcat.cat-alert .ceye{animation:catBlink 4.5s infinite}
.hcat.cat-alert .chead{animation:catTilt 6s ease-in-out infinite}
.hcat.cat-tired .ctail{animation:catSwishSoft 3.2s ease-in-out infinite alternate}
.hcat.cat-tired .ceye{transform:scaleY(.55);animation:catBlinkHalf 6s infinite}
.hcat.cat-tired .clid{opacity:1}
.hcat.cat-tired .cmouth{animation:catYawn 11s ease-in-out infinite}
.hcat.cat-drowsy .ctail{animation:catSwishSoft 5.5s ease-in-out infinite alternate}
.hcat.cat-drowsy .ceye{transform:scaleY(.28);animation:catBlinkSlow 5s ease-in-out infinite}
.hcat.cat-drowsy .clid{opacity:1}
.hcat.cat-drowsy .chead{animation:catNod 6s ease-in-out infinite}
.hcat.cat-drowsy .cmouth{animation:catYawn 8s ease-in-out infinite 2s}
.hcat.cat-sleep .csit{opacity:0}
.hcat.cat-sleep .csleep{opacity:1}
.hcat.cat-sleep .cbreath{animation:catBreath 3.6s ease-in-out infinite}
.hcat.cat-sleep .cz{animation:catZ 3.6s ease-in infinite}
.hcat.cat-sleep .cz2{animation-delay:1.2s}
.hcat.cat-sleep .cz3{animation-delay:2.4s}
.hcat.react:not(.cat-sleep) svg{animation:catStretch 1.1s ease-in-out}
.hcat.react.cat-sleep .cbreath{animation:catStir 1.1s ease-in-out}
@keyframes catBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes catSwish{from{transform:rotate(-20deg)}to{transform:rotate(16deg)}}
@keyframes catSwishSoft{from{transform:rotate(-7deg)}to{transform:rotate(6deg)}}
@keyframes catBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes catBlinkBig{0%,93%,100%{transform:scale(1.15)}96%{transform:scale(1.15,.1)}}
@keyframes catBlinkHalf{0%,88%,100%{transform:scaleY(.55)}93%{transform:scaleY(.08)}}
@keyframes catBlinkSlow{0%,60%,100%{transform:scaleY(.28)}72%,84%{transform:scaleY(.05)}}
@keyframes catTilt{0%,70%,100%{transform:rotate(0)}78%,90%{transform:rotate(-8deg)}}
@keyframes catNod{0%,55%,100%{transform:translateY(0) rotate(0)}70%,82%{transform:translateY(2px) rotate(6deg)}}
@keyframes catYawn{0%,78%,100%{transform:scale(0)}84%,92%{transform:scale(1.15)}}
@keyframes catPaw{0%,60%,100%{transform:translateY(0) rotate(0)}70%,85%{transform:translateY(-5px) rotate(-18deg)}}
@keyframes catBreath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,1.07)}}
@keyframes catZ{0%{opacity:0;transform:translate(0,4px) scale(.7)}25%{opacity:1}100%{opacity:0;transform:translate(4px,-6px) scale(1.1)}}
@keyframes catStretch{0%,100%{transform:none}35%{transform:scale(1.12,.86) translateY(2px)}65%{transform:scale(.94,1.08) translateY(-2px)}}
@keyframes catStir{0%,100%{transform:none}40%{transform:scale(1.06,.94)}}
.hcat .ctapaw{opacity:0;transform-box:view-box;transform-origin:28.5px 37.5px;pointer-events:none}
.hcat .cbean{fill:#F9A8C4}
.hcat .ctapaw *{vector-effect:non-scaling-stroke}
.hcat .ctrip{position:absolute;left:52px;top:73px;width:34px;height:34px;border-radius:50%;border:2.5px solid var(--brand,#0f766e);opacity:0;transform:scale(.2);pointer-events:none;z-index:2}
.hcat.tapping .cpaw{opacity:0}
.hcat.tapping .cbub{opacity:1;transform:none;transition-delay:.25s;left:auto;right:84px;top:58px}
.hcat.tapping.cat-energetic .ctapaw{animation:catTap .55s ease-in-out 2}
.hcat.tapping.cat-energetic .ctrip{animation:catRipple .5s ease-out .3s 2}
.hcat.tapping.cat-alert .ctapaw{animation:catTap .85s ease-in-out}
.hcat.tapping.cat-alert .ctrip{animation:catRipple .6s ease-out .48s}
.hcat.tapping.cat-tired .ctapaw{animation:catTapLazy 1.35s ease-in-out}
.hcat.tapping.cat-tired .ctrip{animation:catRipple .8s ease-out .8s}
.hcat.tapping.cat-drowsy .ctapaw{animation:catTapLazy 2.1s ease-in-out}
.hcat.tapping.cat-drowsy .ctrip{animation:catRipple 1s ease-out 1.25s}
@keyframes catTap{0%{opacity:1;transform:none}35%{opacity:1;transform:translate(-1px,-6px) rotate(-14deg) scale(1.35)}60%{opacity:1;transform:translate(0,1px) scale(2.4)}75%{opacity:1;transform:translate(0,0) scale(2.1)}100%{opacity:1;transform:none}}
@keyframes catTapLazy{0%{opacity:1;transform:none}40%{opacity:1;transform:translate(0,-3px) rotate(-8deg) scale(1.2)}62%{opacity:1;transform:translate(0,1px) scale(1.9)}80%{opacity:1;transform:translate(0,1px) scale(1.75)}100%{opacity:1;transform:none}}
@keyframes catRipple{0%{opacity:.85;transform:scale(.2)}100%{opacity:0;transform:scale(1.5)}}
.hcat .ccollar,.hcat .ctag,.hcat .cspot{display:none}

html[data-theme="dark"] .hcat:not(.mprev){filter:drop-shadow(0 0 5px rgba(205,187,255,.25))}
html[data-theme="dark"] .hcat .cz{fill:#B9B3E8}
.mascotpick{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.mptitle{font-weight:750;font-size:0.9375rem;margin:0 2px 8px}
.mpbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mpbtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.mpbtn.on{border-color:var(--brand);background:var(--brand2)}
@media (prefers-reduced-motion:reduce){.hcat *,.hcat svg{animation:none!important;transition:none!important}}
@keyframes cpurr{0%,100%{transform:translate(0,0)}25%{transform:translate(-1px,.5px) rotate(-1deg)}50%{transform:translate(1px,-.5px)}75%{transform:translate(-.5px,.5px) rotate(1deg)}}
.hcat.purring svg{animation:cpurr .09s linear 16}
@keyframes cbob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}
@media (prefers-reduced-motion:reduce){.hcat.purring svg{animation-iteration-count:4}}
</style>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap">
<style>
#intro{position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#fff8ef,#f1dfc8);transition:opacity 1.8s ease;perspective:1200px}
#intro.out{opacity:0;pointer-events:none}
body.introing>*:not(#intro){opacity:0}
body>*:not(#intro){transition:opacity 1.8s ease}
.ibook{position:relative;width:min(62vw,250px);aspect-ratio:3/4;transform-style:preserve-3d}
.ipage{position:absolute;inset:0;border-radius:4px 12px 12px 4px;background:repeating-linear-gradient(#fffdf8 0 22px,#e8dccb 22px 23px);box-shadow:0 18px 40px rgba(80,50,20,.3);display:flex;align-items:center;justify-content:center}
.ititle{font-family:'Great Vibes','Dancing Script','Brush Script MT',cursive;font-size:min(10vw,42px);color:#5b3a8c;text-align:center;line-height:1.1;clip-path:inset(0 100% 0 0);animation:iwrite 1.1s ease-in-out 1.15s forwards}
.icover{position:absolute;inset:0;border-radius:4px 12px 12px 4px;background:linear-gradient(135deg,#8a5cc4,#5b3a8c);transform-origin:left center;backface-visibility:hidden;box-shadow:inset 6px 0 0 rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;animation:iopen 1.2s cubic-bezier(.5,0,.3,1) .2s forwards}
.icover span{width:56%;height:22%;border:2px solid rgba(255,230,180,.7);border-radius:8px}
@keyframes iopen{to{transform:rotateY(-165deg)}}
@keyframes iwrite{to{clip-path:inset(0 0 0 0)}}
@media (prefers-reduced-motion:reduce){.icover{display:none}.ititle{animation:none;clip-path:none}#intro{transition-duration:.3s}}
</style>
</head>
<body class="introing">
<div id="intro" aria-hidden="true"><div class="ibook"><div class="ipage"><div class="ititle">Monique’s<br>Helper</div></div><div class="icover"><span></span></div></div></div>
<script>(function(){var d=document,b=d.body,el=d.getElementById('intro'),done=0;
function end(){if(done)return;done=1;b.classList.remove('introing');if(el){el.classList.add('out');setTimeout(function(){el.remove()},1900)}}
try{var rm=matchMedia('(prefers-reduced-motion: reduce)').matches;el.addEventListener('pointerdown',end);setTimeout(end,rm?600:2300)}catch(e){end()}
setTimeout(end,5500)})();</script>
<div id="app">
  <main id="view"><noscript>This app needs JavaScript turned on.</noscript></main>
  <nav id="mhtabs" aria-label="Pages"></nav>
</div>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"><span id="toastmsg"></span><button id="toastbtn"></button></div>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
